[build-dependencies.rustc_version]
version = "0.4.1"

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.glob]
version = "0.3.1"

[dependencies.proc-macro-crate]
optional = true
version = "3.2.0"

[dependencies.proc-macro2]
version = "1.0.86"

[dependencies.quote]
version = "1.0.37"

[dependencies.regex]
version = "1.10.6"

[dependencies.relative-path]
version = "1.9.3"

[dependencies.syn]
features = ["full", "parsing", "extra-traits", "visit", "visit-mut"]
version = "2.0.79"

[dependencies.unicode-ident]
version = "1.0.13"

[dev-dependencies.actix-rt]
version = "2.9.0"

[dev-dependencies.async-std]
features = ["attributes"]
version = "1.13.0"

[dev-dependencies.maplit]
version = "1.0.2"

[dev-dependencies.pretty_assertions]
version = "1.4.1"

[dev-dependencies.rstest]
default-features = false
version = "0.22.0"

[features]
async-timeout = []
crate-name = ["dep:proc-macro-crate"]
default = ["async-timeout", "crate-name"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Michele d'Amico <michele.damico@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["development-tools::testing"]
description = """
Rust fixture based test framework. It use procedural macro
to implement fixtures and table based tests.
"""
edition = "2021"
homepage = "https://github.com/la10736/rstest"
keywords = ["test", "fixture"]
license = "MIT OR Apache-2.0"
name = "rstest_macros"
readme = "README.md"
repository = "https://github.com/la10736/rstest"
rust-version = "1.67.1"
version = "0.23.0"
