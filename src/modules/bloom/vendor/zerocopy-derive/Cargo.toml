[dependencies.proc-macro2]
version = "1.0.1"

[dependencies.quote]
version = "1.0.40"

[dependencies.syn]
features = ["full"]
version = "2.0.46"

[dev-dependencies.dissimilar]
version = "1.0.9"

[dev-dependencies.prettyplease]
version = "0.2.17"

[dev-dependencies.rustversion]
version = "1.0"

[dev-dependencies.static_assertions]
version = "1.1"

[dev-dependencies.syn]
features = ["visit"]
version = "2.0.46"

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(__ZEROCOPY_INTERNAL_USE_ONLY_NIGHTLY_FEATURES_IN_TESTS)", 'cfg(__ZEROCOPY_INTERNAL_USE_ONLY_TOOLCHAIN, values("msrv", "stable", "nightly"))', "cfg(coverage_nightly)", "cfg(zerocopy_derive_union_into_bytes)", "cfg(zerocopy_unstable_linux)", "cfg(zerocopy_unstable_ptr)"]
level = "warn"
priority = 0

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "Custom derive for traits from the zerocopy crate"
edition = "2021"
exclude = [".*", "tests/enum_from_bytes.rs", "tests/ui-nightly/enum_from_bytes_u16_too_few.rs.disabled"]
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
name = "zerocopy-derive"
readme = false
repository = "https://github.com/google/zerocopy"
version = "0.8.59"
