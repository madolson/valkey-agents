[dependencies.anstream]
optional = true
version = "0.6.15"

[dependencies.anstyle]
optional = true
version = "1.0.8"

[dependencies.is_terminal_polyfill]
optional = true
version = "1.48.1"

[dependencies.memchr]
default-features = false
optional = true
version = "2.7"

[dependencies.terminal_size]
optional = true
version = "0.4.3"

[dev-dependencies.annotate-snippets]
version = "0.11.4"

[dev-dependencies.anyhow]
version = "1.0.100"

[dev-dependencies.automod]
version = "1.0.15"

[dev-dependencies.circular]
version = "0.3.0"

[dev-dependencies.criterion]
version = "0.5.1"

[dev-dependencies.lexopt]
version = "0.3.1"

[dev-dependencies.proptest]
version = "1.6.0"

[dev-dependencies.rustc-hash]
version = "2.1.1"

[dev-dependencies.snapbox]
features = ["examples"]
version = "0.6.21"

[dev-dependencies.term-transcript]
version = "0.2.0"

[features]
alloc = []
ascii = ["parser"]
binary = ["parser"]
debug = ["std", "dep:anstream", "dep:anstyle", "dep:is_terminal_polyfill", "dep:terminal_size"]
default = ["std", "ascii", "binary"]
parser = []
simd = ["dep:memchr"]
std = ["alloc", "memchr?/std"]
unstable-doc = ["alloc", "std", "ascii", "binary", "simd", "unstable-recover"]
unstable-recover = ["parser"]

[lib]
path = "src/lib.rs"

[lints.clippy]
bool_assert_comparison = "allow"
branches_sharing_code = "allow"
byte_char_slices = "allow"
checked_conversions = "warn"
collapsible_else_if = "allow"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_and_return = "allow"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
mem_forget = "warn"
mutex_integer = "warn"
needless_continue = "allow"
needless_for_each = "warn"
negative_feature_names = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
result_large_err = "allow"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"

[lints.rust]
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["parsing"]
description = "A byte-oriented, zero-copy, parser combinators library"
edition = "2021"
include = ["build.rs", "src/**/*", "Cargo.toml", "Cargo.lock", "LICENSE*", "README.md", "examples/**/*"]
keywords = ["parser", "parser-combinators", "parsing", "streaming", "bit"]
license = "MIT"
name = "winnow"
readme = "README.md"
repository = "https://github.com/winnow-rs/winnow"
rust-version = "1.65.0"
version = "1.0.4"

[package.metadata.docs.rs]
features = ["unstable-doc"]
rustdoc-args = ["--generate-link-to-definition"]

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{version}}"
search = "Unreleased"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = "...{{tag_name}}"
search = '\.\.\.HEAD'

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{date}}"
search = "ReleaseDate"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = """
<!-- next-header -->
## [Unreleased] - ReleaseDate
"""
search = "<!-- next-header -->"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = """
<!-- next-url -->
[Unreleased]: https://github.com/winnow-rs/winnow/compare/{{tag_name}}...HEAD"""
search = "<!-- next-url -->"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "src/lib.rs"
replace = "blob/v{{version}}/CHANGELOG.md"
search = 'blob/v.+\..+\..+/CHANGELOG.md'

[profile.bench]
codegen-units = 1
debug = 2
lto = true

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
