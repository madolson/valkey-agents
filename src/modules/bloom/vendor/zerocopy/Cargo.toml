[dependencies.zerocopy-derive]
optional = true
version = "=0.8.59"

[dev-dependencies.elain]
version = "0.3.0"

[dev-dependencies.itertools]
version = "0.11"

[dev-dependencies.rand]
default-features = false
features = ["small_rng"]
version = "0.8.7"

[dev-dependencies.regex]
version = "1.0"

[dev-dependencies.rustversion]
version = "1.0"

[dev-dependencies.static_assertions]
version = "1.1"

[dev-dependencies.zerocopy-derive]
version = "=0.8.59"

[features]
__internal_use_only_features_that_work_on_stable = ["alloc", "derive", "simd", "std"]
alloc = []
derive = ["zerocopy-derive"]
float-nightly = []
simd = []
simd-nightly = ["simd"]
std = ["alloc"]

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["embedded", "encoding", "no-std::no-alloc", "parsing", "rust-patterns"]
description = """Zerocopy makes zero-cost memory manipulation effortless. We write "unsafe" so you don't have to."""
edition = "2021"
exclude = [".*"]
keywords = ["cast", "convert", "transmute", "transmutation", "type-punning"]
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
name = "zerocopy"
readme = "README.md"
repository = "https://github.com/google/zerocopy"
rust-version = "1.56.0"
version = "0.8.59"

[package.metadata.build-rs]
no-zerocopy-aarch64-simd-1-59-0 = "1.59.0"
no-zerocopy-aarch64-simd-be-1-87-0 = "1.87.0"
no-zerocopy-core-error-1-81-0 = "1.81.0"
no-zerocopy-diagnostic-on-unimplemented-1-78-0 = "1.78.0"
no-zerocopy-generic-bounds-in-const-fn-1-61-0 = "1.61.0"
no-zerocopy-panic-in-const-and-vec-try-reserve-1-57-0 = "1.57.0"
no-zerocopy-simd-x86-avx12-1-89-0 = "1.89.0"
no-zerocopy-slice-ptr-len-1-79-0 = "1.79.0"
no-zerocopy-target-has-atomics-1-60-0 = "1.60.0"

[package.metadata.ci]
pinned-nightly = "nightly-2026-01-25"
pinned-stable = "1.93.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_cfg", "--generate-link-to-definition", "--extend-css", "rustdoc/style.css"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "i686-unknown-linux-gnu", "i686-pc-windows-msvc"]

[package.metadata.playground]
features = ["__internal_use_only_features_that_work_on_stable"]

[target."cfg(any())".dependencies.zerocopy-derive]
version = "=0.8.59"
