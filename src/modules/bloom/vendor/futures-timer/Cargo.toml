[dev-dependencies.async-std]
features = ["attributes"]
version = "1.13"

[dev-dependencies.futures]
version = "0.3.1"

[features]
wasm-bindgen = ["gloo-timers", "send_wrapper"]

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(assert_timer_heap_consistent)"]
level = "warn"
priority = 0

[package]
authors = ["Alex Crichton <alex@alexcrichton.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = """
Timeouts for futures.
"""
documentation = "https://docs.rs/futures-timer"
edition = "2018"
homepage = "https://github.com/async-rs/futures-timer"
license = "MIT/Apache-2.0"
name = "futures-timer"
readme = "README.md"
repository = "https://github.com/async-rs/futures-timer"
version = "3.0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.gloo-timers]
features = ["futures"]
optional = true
version = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.send_wrapper]
optional = true
version = "0.6.0"
