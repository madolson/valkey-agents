[dependencies.serde]
default-features = false
features = ["alloc"]
optional = true
version = "1.0.95"

[dev-dependencies.serde]
features = ["derive"]
version = "1"

[dev-dependencies.serde_test]
version = "1"

[features]
default = ["std"]
std = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Carl Lerche <me@carllerche.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["memory-management", "data-structures", "no-std"]
description = "Pre-allocated storage for a uniform data type"
edition = "2018"
exclude = ["/.*"]
keywords = ["slab", "allocator", "no_std"]
license = "MIT"
name = "slab"
readme = "README.md"
repository = "https://github.com/tokio-rs/slab"
rust-version = "1.51"
version = "0.4.12"
